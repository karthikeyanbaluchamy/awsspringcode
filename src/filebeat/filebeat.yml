filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /app/logs/*.log

    #json.keys_under_root: true
    #json.add_error_key: true

processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true

output.elasticsearch:
  hosts: ["https://my-elasticsearch-project-a6f27d.es.us-central1.gcp.elastic.cloud:443"]
  api_key: "emVYVjlKMEJxVFB2NnVKVVFmUnU6b3FNOENtUEtRdE9nWHlhRzhZVmxEQQ=="

  ssl.enabled: true
  ssl.verification_mode: none

  index: "springboot-logs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false

setup.template.name: "springboot-logs"
setup.template.pattern: "springboot-logs-*"

logging.level: info
